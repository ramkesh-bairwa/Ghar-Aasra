# Values come from the .env file next to this file (Docker Compose reads it
# automatically). On the server that's /var/www/gharaasra/.env, e.g.:
#   DB_NAME=ghar_aashra
#   DB_USER=root
#   DB_PASSWORD=<your mysql root password>
#   JWT_SECRET=<long random string>
# Anything missing falls back to the default after ":-".

services:

  flexhome:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gharaasra_flexhome
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - flexhome_node_modules:/app/node_modules
      - flexhome_next_cache:/app/.next
    environment:
      # Inside Docker the app always reaches MySQL through the "mysql" service.
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-ghar_aashra}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-string}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID:-}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET:-}
      - ZOHO_REGION=${ZOHO_REGION:-in}
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - gharaasra-net

  mysql:
    image: mysql:8.0
    container_name: gharaasra_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      # Only used the very first time the data volume is created.
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_NAME:-ghar_aashra}
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf
      # First start of a fresh volume: create all tables in MYSQL_DATABASE.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3307:3306"
    networks:
      - gharaasra-net

volumes:
  dbdata:
  flexhome_node_modules:
  flexhome_next_cache:

networks:
  gharaasra-net:
    driver: bridge
