services:

  flexhome:
    build:
      context: ./src/flexhome
      dockerfile: ../../docker/flexhome/Dockerfile
    container_name: gharaasra_flexhome
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./src/flexhome:/app
      - flexhome_node_modules:/app/node_modules
      - flexhome_next_cache:/app/.next
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=flexhome
      - JWT_SECRET=change-this-to-a-long-random-string
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - gharaasra-net

  mysql:
    image: mysql:8.0
    container_name: gharaasra_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=flexhome
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    networks:
      - gharaasra-net

volumes:
  dbdata:
  flexhome_node_modules:
  flexhome_next_cache:

networks:
  gharaasra-net:
    driver: bridge
